[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "topology-gate"
dynamic = ["version"]
description = "Typed integration contracts for topology-gated recursive quant model research."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Topology Gate contributors" }]
keywords = ["research", "recursive-model", "topology", "e-process", "backtest"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = []

[project.optional-dependencies]
# The core package is dependency-light. These extras are for worker modules
# that perform numerical, statistical, or tabular operations.
numeric = ["numpy==2.2.6"]
statistics = ["numpy==2.2.6", "scipy>=1.11,<2"]
data = ["numpy==2.2.6", "pandas>=2.1,<3"]

# These direct pins define the release-gate environment used by this project.
# They do not claim that every transitive dependency or third-party numerical
# kernel is bit-for-bit reproducible across platforms.
test = [
    "numpy==2.2.6",
    "pytest==8.3.4",
    "pytest-cov==7.1.0",
]
dev = [
    "numpy==2.2.6",
    "pytest==8.3.4",
    "pytest-cov==7.1.0",
    "mypy==2.1.0",
    "ruff==0.15.20",
    "build==1.2.2.post1",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "topology_gate.__version__" }

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --cov=topology_gate --cov-report=term-missing --cov-fail-under=75"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: exercises more than one topology_gate component",
    "slow: takes materially longer than a unit test",
]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
packages = ["topology_gate"]
check_untyped_defs = true
disallow_any_generics = false
warn_unused_ignores = false

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.topology_gate.release]
# The CI/release gate exercises every supported interpreter in the package
# metadata; the direct dependency pins remain captured in the 3.12 baseline.
tested_python = "3.10,3.11,3.12"
direct_dev_test_dependencies = "exact pins in project.optional-dependencies"
transitive_dependency_policy = "resolver-managed; not hash-locked"
