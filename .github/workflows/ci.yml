name: release-gates

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and pinned release tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q -p no:cacheprovider
      - name: Lint
        run: ruff check src tests examples
      - name: Type check
        run: mypy src
      - name: Compile
        run: python -m compileall -q src tests
      - name: Build wheel
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct -- pyproject.toml src)"
          python -m pip wheel . --no-deps --wheel-dir "$RUNNER_TEMP/topology-gate-wheel"
