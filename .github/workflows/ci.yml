name: release-gates

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and pinned release tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q -p no:cacheprovider
      - name: Lint
        run: ruff check src tests examples
      - name: Type check
        run: mypy src
      - name: Compile
        run: python -m compileall -q src tests
      - name: Build wheel
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct -- pyproject.toml src)"
          python -m pip wheel . --no-deps --wheel-dir "$RUNNER_TEMP/topology-gate-wheel"
      - name: Verify deterministic wheel and dependency-free import
        if: matrix.python-version == '3.12'
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct -- pyproject.toml src)"
          first_dir="$(mktemp -d)"
          second_dir="$(mktemp -d)"
          target_dir="$(mktemp -d)"
          python -m pip wheel . --no-deps --no-cache-dir --wheel-dir "$first_dir"
          python -m pip wheel . --no-deps --no-cache-dir --wheel-dir "$second_dir"
          first_wheel="$(find "$first_dir" -maxdepth 1 -name '*.whl' -print -quit)"
          second_wheel="$(find "$second_dir" -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$first_wheel" && test -n "$second_wheel"
          test "$(sha256sum "$first_wheel" | cut -d ' ' -f 1)" = "$(sha256sum "$second_wheel" | cut -d ' ' -f 1)"
          python -m pip install --no-deps --no-index --target "$target_dir" "$first_wheel"
          PYTHONPATH="$target_dir" python -S -c "import topology_gate; print('dependency-free wheel import ok')"
