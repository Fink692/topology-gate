name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install the development environment
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests examples

      - name: Type-check
        run: mypy src

      - name: Compile
        run: python -m compileall -q src tests examples

      - name: Build wheel
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct -- pyproject.toml src)"
          python -m pip wheel . --no-deps --wheel-dir "$RUNNER_TEMP/topology-gate-wheel"

      - name: Verify dependency-free import
        if: matrix.python-version == '3.12'
        run: |
          wheel_path="$(find "$RUNNER_TEMP/topology-gate-wheel" -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$wheel_path"
          target_dir="$(mktemp -d)"
          python -m pip install --no-deps --no-index --target "$target_dir" "$wheel_path"
          PYTHONPATH="$target_dir" python -S -c "import topology_gate; print('dependency-free wheel import ok')"

      - name: Test
        run: python -m pytest
